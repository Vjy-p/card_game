name: Game maintenance

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  resolve-game-timeouts:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke maintenance worker
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          GAME_MAINTENANCE_SECRET: ${{ secrets.GAME_MAINTENANCE_SECRET }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "x-game-maintenance-secret: ${GAME_MAINTENANCE_SECRET}" \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/resolve-game-timeouts"
