<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Card Game</title>
    <script type="text/javascript">
      // GitHub Pages /path/ strategy fix
      var pathSegmentsToKeep = 1; // This matches your /card_game/ base href
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
